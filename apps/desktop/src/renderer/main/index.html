<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data:; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side</title>
<link rel="stylesheet" href="side.css">
<style>
  html, body { height: 100%; background: #fff; }
  .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
  .app .nav { overflow: auto; }
  /* The right 132px stay free: sidy sits at the screen edge there. */
  .app .content { padding: 36px 132px 40px 48px; overflow: auto; min-width: 0; }
  .hero { align-items: center; }
  .hero .asked { margin: 10px 0 0; font-size: 15px; color: var(--ink); }
  .btn.big { height: 48px; padding: 0 22px; font-size: 16px; }
  .seg .seg-big { height: 40px; padding: 0 16px; font-size: 15px; }
  .set-h { font-size: 18px; margin: 28px 0 0; }
  .field-error { margin: 6px 0 0; font-size: 14px; color: var(--danger); }
  .field input[aria-invalid=true] { border-color: var(--danger); }
  .set select.time { height: 36px; border-radius: 10px; border: 1.5px solid var(--line); padding: 0 8px; font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
  .tbl td { overflow-wrap: anywhere; }
  .quiet ul li { margin: 2px 0; }
</style>
</head>
<body><div id="app"></div><script src="main.js"></script></body>
</html>
